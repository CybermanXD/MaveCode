name: Release Stable VSIX

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:

# Least privilege: publish-stable escalates to contents: write via its own
# job-level permissions block.
permissions:
    contents: read

jobs:
    release-stable-vsix:
        runs-on: ubuntu-latest
        environment: marketplace-production
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
              with:
                  install-args: "--frozen-lockfile"

            - name: Validate package identity
              run: |
                  package_name=$(node -p "require('./src/package.json').name")
                  publisher=$(node -p "require('./src/package.json').publisher")

                  test "$package_name" = "mave-code"
                  test "$publisher" = "MaveCode"

            - name: Validate publish ref
              run: |
                  if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
                    echo "Manual stable publishes must run from main, not ${GITHUB_REF_NAME}."
                    exit 1
                  fi

            - name: Validate release tag
              if: github.event_name == 'push'
              run: |
                  package_version=$(node -p "require('./src/package.json').version")
                  tag_version="${GITHUB_REF_NAME#v}"

                  if [ "$package_version" != "$tag_version" ]; then
                    echo "Tag v${tag_version} does not match src/package.json version ${package_version}."
                    exit 1
                  fi

            - name: Build workspace packages
              run: |
                  pnpm --filter @roo-code/build build
                  pnpm --filter @roo-code/vscode-webview build

            - name: Package extension
              env:
                  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
                  MAVE_CODE_AUTH_PAGE_URL: https://mavecode.blogspot.com/
                  MAVE_CODE_BACKEND_URL: ${{ secrets.MAVE_CODE_BACKEND_URL }}
              run: |
                  test -n "$MAVE_CODE_AUTH_PAGE_URL"
                  test -n "$MAVE_CODE_BACKEND_URL"
                  echo "$MAVE_CODE_BACKEND_URL" | grep -Eq '^https://script\.google\.com/macros/s/[^/]+/exec/?$'

                  package_version=$(node -p "require('./src/package.json').version")
                  pnpm --filter ./src vsix

                  vsix_path="bin/mave-code-${package_version}.vsix"
                  test -f "$vsix_path"

                  unzip -l "$vsix_path" > /tmp/mave-code-vsix-contents.txt
                  grep -q "extension/package.json" /tmp/mave-code-vsix-contents.txt
                  grep -q "extension/package.nls.json" /tmp/mave-code-vsix-contents.txt
                  grep -q "extension/dist/extension.js" /tmp/mave-code-vsix-contents.txt
                  grep -q "extension/webview-ui/audio/celebration.wav" /tmp/mave-code-vsix-contents.txt
                  grep -q "extension/webview-ui/build/assets/index.js" /tmp/mave-code-vsix-contents.txt
                  grep -q "extension/assets/codicons/codicon.ttf" /tmp/mave-code-vsix-contents.txt
                  grep -q "extension/assets/vscode-material-icons/icons/3d.svg" /tmp/mave-code-vsix-contents.txt
                  unzip -p "$vsix_path" extension/dist/extension.js | grep -q "script.google.com/macros/s/"
                  unzip -p "$vsix_path" extension/dist/extension.js | grep -q "https://mavecode.blogspot.com/"

            - name: Validate packaged manifest identity
              run: |
                  package_version=$(node -p "require('./src/package.json').version")
                  vsix_path="bin/mave-code-${package_version}.vsix"

                  artifact_name=$(unzip -p "$vsix_path" extension/package.json | jq -r '.name')
                  artifact_publisher=$(unzip -p "$vsix_path" extension/package.json | jq -r '.publisher')

                  test "$artifact_name" = "mave-code"
                  test "$artifact_publisher" = "MaveCode"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  package_version=$(node -p "require('./src/package.json').version")
                  if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
                    tag_name="$GITHUB_REF_NAME"
                  else
                    tag_name="v${package_version}"
                  fi
                  vsix_path="bin/mave-code-${package_version}.vsix"

                  changelog_content=$(awk -v version="$package_version" '
                    $0 ~ "^## \\[" version "\\]" { found = 1 }
                    found && $0 == "---" { exit }
                    found && $0 ~ "^## " && $0 !~ "^## \\[" version "\\]" { exit }
                    found { print }
                  ' CHANGELOG.md)
                  if [ -z "$changelog_content" ]; then
                    changelog_content="Release ${tag_name}"
                  fi
                  printf "%s\n" "$changelog_content" > /tmp/mave-code-release-notes.md

                  if gh release view "$tag_name" >/dev/null 2>&1; then
                    gh release upload "$tag_name" "$vsix_path" --clobber
                  else
                    gh release create "$tag_name" \
                      --title "MaveCode ${tag_name}" \
                      --notes-file /tmp/mave-code-release-notes.md \
                      --target "$GITHUB_SHA" \
                      "$vsix_path"
                  fi
